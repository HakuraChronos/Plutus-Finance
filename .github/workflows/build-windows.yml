name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build Plutus.exe
        shell: powershell
        run: .\scripts\build-windows.ps1

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Plutus-Windows
          path: dist/Plutus-Windows.zip
          if-no-files-found: error

      - name: Attach executable to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist/Plutus-Windows.zip --clobber
          } else {
            gh release create "${{ github.ref_name }}" dist/Plutus-Windows.zip --title "Plutus ${{ github.ref_name }}" --generate-notes
          }
