name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run automated tests
        shell: powershell
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jsTests = Get-ChildItem tests\test_*.mjs | Select-Object -ExpandProperty FullName
          node --test $jsTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Plutus.exe
        shell: powershell
        run: .\scripts\build-windows.ps1

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Plutus-Windows
          path: dist/Plutus-Windows.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Plutus-Windows.zip
          generate_release_notes: true
